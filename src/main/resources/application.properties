# Oracle JDBC / UCP. Credentials only come from the process environment; never commit them here.
micronaut.application.name=micronaut-oracle-chat-memory-store
micronaut.server.port=${APP_PORT:8080}
micronaut.views.thymeleaf.enabled=true
micronaut.views.folder=views
micronaut.router.static-resources.default.mapping=/assets/**
micronaut.router.static-resources.default.paths=classpath:static
micronaut.security.filter.static-resource-authentication-bypass=true
micronaut.security.intercept-url-map[0].pattern=/assets/**
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()
datasources.default.url=${DB_URL}
datasources.default.username=${DB_USERNAME}
datasources.default.password=${DB_PASSWORD}
datasources.default.driver-class-name=oracle.jdbc.OracleDriver
datasources.default.dialect=oracle
datasources.default.connection-factory-class-name=oracle.jdbc.pool.OracleDataSource
datasources.default.min-pool-size=2
datasources.default.max-pool-size=10

# Local console tracing: spans correlate HTTP, chat-memory, and Oracle UCP activity.
# No prompt/response text or JDBC bind values is emitted by this configuration.
micronaut.otel.enabled=true
otel.service.name=${micronaut.application.name}
# The application-owned ConsoleSpanProcessorFactory is the single local exporter.
# Set OTEL_TRACES_EXPORTER to another supported remote exporter when deploying.
otel.traces.exporter=${OTEL_TRACES_EXPORTER:none}
otel.metrics.exporter=none
otel.logs.exporter=none
otel.instrumentation.ucp.enabled=true

# The table is intentionally created separately: OracleChatMemoryStore requires it to exist.
langchain4j.chat-memory-store.oracle.default.enabled=true
langchain4j.chat-memory-store.oracle.default.table-name=CHAT_MEMORY
langchain4j.chat-memory-store.oracle.default.memory-id-column-name=MEMORY_ID
langchain4j.chat-memory-store.oracle.default.content-column-name=CONTENT
langchain4j.chat-memory-store.message-window.max-messages=12

# Oracle AI Vector Search creates this embedding table on demand.
langchain4j.oracle.embedding-stores.default.table=DOCUMENT_EMBEDDINGS
langchain4j.oracle.embedding-stores.default.table.create-option=create_if_not_exists

# OpenAI supplies both ChatModel and EmbeddingModel. Keep real key material outside source control.
langchain4j.open-ai.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.model-name=${OPENAI_CHAT_MODEL:gpt-4o-mini}
langchain4j.open-ai.chat-model.temperature=0.2
langchain4j.open-ai.embedding-model.model-name=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# The id derives from OracleKnowledgeAgent -> oracle-knowledge.
langchain4j.agentic.agents.oracle-knowledge.memory.max-messages=12

# Application logs record operation metadata and trace IDs, never prompt/response payloads.
logger.levels.io.micronaut.oracle.dev=INFO
